name: Build JARVIS 2.0 for Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build EXE
        run: pyinstaller --clean --noconfirm --onefile --windowed --name JARVIS2 --hidden-import=tkinter --collect-submodules=tkinter jarvis_pc.py

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: powershell
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\JARVIS2.iss'

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS2-Windows-EXE
          path: dist\JARVIS2.exe

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS2-Windows-Installer
          path: installer\JARVIS-Setup.exe
