name: Build JARVIS 2.0 for Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller
      - name: Build EXE
        run: pyinstaller --onefile --windowed --name JARVIS2 jarvis_pc.py
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS2-Windows
          path: dist/JARVIS2.exe
